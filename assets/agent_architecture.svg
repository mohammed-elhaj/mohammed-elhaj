<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="How I build agents: channels connect to an LLM agent that retrieves with RAG, acts through tools, and is improved by evals and observability">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill: #111a2e; stroke: #334155; stroke-width: 1.5; }
      .t { font: 600 18px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f1f5f9; }
      .s { font: 400 14px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .h { font: 600 13px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #64748b; letter-spacing: 1.5px; }
      .ln { stroke: #94a3b8; stroke-width: 1.8; fill: none; }
      .flow { stroke: #a78bfa; stroke-width: 2.2; fill: none; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      .lbl { font: 600 13px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #c4b5fd; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>

  <!-- channels -->
  <text x="60" y="52" class="h">CHANNELS</text>
  <rect x="40" y="68" width="252" height="64" rx="12" class="box"/>
  <text x="60" y="97" class="t">📞 Phone · SIP</text>
  <text x="60" y="119" class="s">inbound &amp; outbound calls</text>
  <rect x="40" y="148" width="252" height="64" rx="12" class="box"/>
  <text x="60" y="177" class="t">🌐 Web widget</text>
  <text x="60" y="199" class="s">voice &amp; chat</text>
  <rect x="40" y="228" width="252" height="64" rx="12" class="box"/>
  <text x="60" y="257" class="t">💬 WhatsApp · Telegram</text>
  <text x="60" y="279" class="s">messaging bots</text>

  <!-- channels -> agent -->
  <path d="M292 100 C 335 100, 335 180, 372 180" class="flow"/>
  <path d="M292 180 L 372 180" class="flow"/>
  <path d="M292 260 C 335 260, 335 180, 372 180" class="flow"/>

  <!-- agent -->
  <rect x="380" y="112" width="300" height="136" rx="16" fill="url(#core)" stroke="#a78bfa" stroke-width="2"/>
  <text x="530" y="160" text-anchor="middle" class="t" style="font-size:22px">🤖 LLM agent</text>
  <text x="530" y="188" text-anchor="middle" class="s" style="fill:#c7d2fe">reasoning · memory · tool use</text>
  <text x="530" y="212" text-anchor="middle" class="s" style="fill:#c7d2fe">real-time STT → LLM → TTS for voice</text>

  <!-- agent <-> RAG -->
  <path d="M680 150 C 760 150, 760 92, 818 92" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="712" y="108" class="lbl">retrieve</text>
  <rect x="822" y="52" width="338" height="80" rx="12" class="box"/>
  <text x="844" y="84" class="t">🔎 RAG</text>
  <text x="844" y="110" class="s">hybrid BM25 + dense search · cited answers</text>

  <!-- agent <-> tools -->
  <path d="M680 212 C 760 212, 760 268, 818 268" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="742" y="234" class="lbl">act</text>
  <rect x="822" y="228" width="338" height="80" rx="12" class="box"/>
  <text x="844" y="260" class="t">🔧 Tools</text>
  <text x="844" y="286" class="s">customer APIs · CRMs · bookings · tickets</text>

  <!-- evals loop -->
  <rect x="380" y="320" width="780" height="70" rx="12" class="box" style="stroke:#22c55e"/>
  <text x="404" y="352" class="t">🧪 Evals &amp; observability</text>
  <text x="404" y="376" class="s">LLM judges · scenario benchmarks · simulated personas · latency &amp; call analytics</text>
  <path d="M500 248 L 500 316" class="ln" marker-end="url(#arr)"/>
  <path d="M600 316 L 600 252" class="flow" style="stroke:#22c55e" marker-end="url(#arr)"/>
  <text x="612" y="292" class="lbl" style="fill:#86efac">improve</text>
</svg>
